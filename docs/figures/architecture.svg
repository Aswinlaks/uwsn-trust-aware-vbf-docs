   <g id="text_1">
    <text style="fill: #2a78d6; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="30.96" y="37.733281" transform="rotate(-0 30.96 37.733281)">1  Simulation  (ns-3.41 + Aqua-Sim-NG)</text>
   </g>
   <g id="text_2">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="58.726219" transform="rotate(-0 30.96 58.726219)">100 nodes, HH-VBF routing (AquaSimTrustQVBF module), meandering-current mobility</text>
   </g>
   <g id="text_3">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="76.006219" transform="rotate(-0 30.96 76.006219)">selective-forwarding insiders; zero-noise channel, so losses are collisions</text>
   </g>
   <g id="text_4">
    <text style="fill: #3d9a4a; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="30.96" y="129.893281" transform="rotate(-0 30.96 129.893281)">2  Node records</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="150.886219" transform="rotate(-0 30.96 150.886219)">each node keeps only its own trace: the headers it decoded,</text>
   </g>
   <g id="text_6">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="168.166219" transform="rotate(-0 30.96 168.166219)">its own transmissions and its own position</text>
   </g>
   <g id="text_7">
    <text style="fill: #b8741a; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="30.96" y="222.053281" transform="rotate(-0 30.96 222.053281)">3  Passive observer  (offline emulator)</text>
   </g>
   <g id="text_8">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="243.046219" transform="rotate(-0 30.96 243.046219)">candidates: fresh, in range, inside the per-hop pipe; O1 adds the VBF</text>
   </g>
   <g id="text_9">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="260.326219" transform="rotate(-0 30.96 260.326219)">priority test and hold-time rank; outcome: MATCH / SILENT / OTHER-UP</text>
   </g>
   <g id="text_10">
    <text style="fill: #7b5bd1; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="30.96" y="314.168359" transform="rotate(-0 30.96 314.168359)">4  Scoring</text>
   </g>
   <g id="text_11">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="335.206219" transform="rotate(-0 30.96 335.206219)">pair score r = (K − Σq) / n, judged if n ≥ 14; node rules: R0 max-pair,</text>
   </g>
   <g id="text_12">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="352.486219" transform="rotate(-0 30.96 352.486219)">R3 median fusion, BETA counts, CA channel-aware comparator</text>
   </g>
   <g id="text_13">
    <text style="fill: #c94a5b; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="30.96" y="406.373281" transform="rotate(-0 30.96 406.373281)">5  Evaluator</text>
   </g>
   <g id="text_14">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="427.366219" transform="rotate(-0 30.96 427.366219)">labels applied only after scoring; AUC, network-cluster bootstrap, Holm</text>
   </g>
   <g id="text_15">
    <text style="fill: #1f2328; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="30.96" y="444.646219" transform="rotate(-0 30.96 444.646219)">Study A (O1 vs B-PIPE), Study B (fusion, coverage), Study C (comparison)</text>
   </g>
   <g id="text_16">
    <text style="fill: #57606a; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="554.4" y="37.595312" transform="rotate(-0 554.4 37.595312)">Ground truth</text>
   </g>
   <g id="text_17">
    <text style="fill: #1f2328; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="58.698625" transform="rotate(-0 554.4 58.698625)">(simulator logs)</text>
   </g>
   <g id="text_18">
    <text style="fill: #1f2328; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="75.978625" transform="rotate(-0 554.4 75.978625)">drop decisions, insider list</text>
   </g>
   <g id="text_19">
    <text style="fill: #1f2328; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="93.258625" transform="rotate(-0 554.4 93.258625)">never seen by observers;</text>
   </g>
   <g id="text_20">
    <text style="fill: #1f2328; font: 9.2px 'DejaVu Sans'; text-anchor: start" x="554.4" y="110.538625" transform="rotate(-0 554.4 110.538625)">evaluator only, after scoring</text>
   </g>
